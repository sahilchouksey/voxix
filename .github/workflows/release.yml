name: "Release"

on: workflow_dispatch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' core/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`;
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              });
              return data.id;
            } catch (err) {
              // 422 already_exists: a previous dispatch already created a draft for this
              // tag. Fetch and return the existing draft's ID so the build jobs can
              // upload assets into it rather than failing the whole pipeline.
              if (err.status === 422) {
                const releases = await github.paginate(
                  github.rest.repos.listReleases,
                  { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
                );
                const existing = releases.find(r => r.tag_name === tag && r.draft);
                if (existing) {
                  core.info(`Draft for ${tag} already exists (id=${existing.id}); reusing it.`);
                  return existing.id;
                }
              }
              throw err;
            }

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs. macos-latest resolves to ARM64 since July 2026; use -large for x64.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "voxix"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  verify:
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          mkdir -p assets
          gh api --paginate \
            "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[].id' | while read -r asset_id; do
              asset_name=$(gh api \
                "repos/${{ github.repository }}/releases/assets/$asset_id" \
                --jq '.name')
              case "$asset_name" in
                SHA256SUMS|*.minisig) continue ;;
              esac
              gh api -H "Accept: application/octet-stream" \
                "repos/${{ github.repository }}/releases/assets/$asset_id" \
                > "assets/$asset_name"
            done
          ls -la assets

      - name: Generate SHA256SUMS
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign artifacts with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: assets
        run: |
          echo "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/voxix.sec"
          chmod 600 "$RUNNER_TEMP/voxix.sec"
          for f in *; do
            case "$f" in
              SHA256SUMS*|*.minisig) continue ;;
            esac
            minisign -Sm "$f" -s "$RUNNER_TEMP/voxix.sec"
          done

      - name: Upload SHA256SUMS and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        working-directory: assets
        run: |
          existing_assets=$(mktemp)
          gh api --paginate \
            "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100" \
            > "$existing_assets"
          for asset in SHA256SUMS *.minisig; do
            asset_name=$(basename "$asset")
            jq -r --arg name "$asset_name" \
              '.[] | select(.name == $name) | .id' "$existing_assets" |
            while read -r asset_id; do
              gh api --method DELETE \
                "repos/${{ github.repository }}/releases/assets/$asset_id"
            done
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              -f "name=$asset_name" \
              --input "$asset" >/dev/null
          done

      # Attestations require a public repository on a free plan; keep this
      # non-blocking so the verify job stays green before going public.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: assets/*
