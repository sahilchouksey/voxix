[package]
name = "voxix"
version = "0.1.0"
description = "voxix speech to text"
authors = ["Sahil Chouksey"]
edition = "2021"
license = "MIT"
default-run = "voxix"

[features]
# Optional Opus codec for the v1 WS audio plane (SDK plan §6; M5 ships it
# default-off — the service config flag `opus_enabled` gates usage).
service-opus = ["opus-rs"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voxix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "io-util", "io-std"] }
axum = { version = "0.8", features = ["http1", "json", "ws"] }
async-channel = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
subtle = "2"
base64 = "0.22"
libc = "0.2"
getrandom = "0.2"
vad-rs = { path = "crates/vad-rs", default-features = false }
enigo = { version = "0.6.1", features = ["wayland"] }
# Saves the vendor from above: an owner-controlled rodio fork pinned by the
# resolved revision; the released 0.20.1 lacks OutputStreamBuilder (used here).
rodio = { path = "crates/rodio" }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.1.3", default-features = false }
voxix-keys = { path = "crates/voxix-keys" }
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
# Optional Opus codec (SDK plan §6); default-off feature, runtime-gated by the
# service config `opus_enabled` (spec default-off).
opus-rs = { version = "0.1.41", optional = true }
hf-hub = { path = "crates/hf-hub", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"

[target.'cfg(windows)'.dependencies]
# ONNX Runtime on Windows is CPU-only (no ort-directml), matching macOS/Linux.
# The DirectML EP was experimental and, more importantly, pulled in pyke's
# prebuilt ONNX Runtime which is compiled with a global /arch:AVX2 baseline that
# executes BMI2/AVX in a static initializer and crashes at process startup on any
# pre-Haswell CPU (Sandy/Ivy Bridge, older AMD). Dropping the feature means we
# link a baseline ONNX Runtime (dynamically, via ORT_LIB_LOCATION in build.yml)
# with proper runtime CPU dispatch. Base `transcribe-rs` (features = ["onnx"])
# is inherited here, so Parakeet/Moonshine/etc. still run on CPU.
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

# Whisper backend per Windows arch. x86_64 ships the Vulkan GPU backend and
# keeps the dynamic-backends posture (loadable per-ISA CPU modules + Vulkan),
# where runtime ISA scoring (GGML_CPU_ALL_VARIANTS) earns the extra shipped DLLs.
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links transcribe-cpp
# STATICALLY (no features = static CPU-only): the one CPU backend is compiled into
# voxix.exe and we ship zero DLLs, which sidesteps the installer's per-DLL
# signtool verify entirely. CI pins -DGGML_NATIVE=OFF (see build.yml) so the
# static build targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }
# Used by the receipt-sequenced ("reliable") paste path for lazy NSPasteboard
# promises. Versions track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
] }

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a personal fork of tao, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown. the pinned revision = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but vendoring both entries to the same `tao-macros-0.1.3` dir can fail
# with a symlink collision. Unifying the source removes the dup.
# Vendored person-fork of tao pinned by the resolved revision (see above).
[patch.crates-io]
tao = { path = "crates/tao" }
tao-macros = { path = "crates/tao/tao-macros" }
# Vendored zbus patch: the vendored fork embeds its own base-16 handshake
# codec, dropping the external base-16 codec dependency from its auth
# path. Manifest and handshake behavior are otherwise 5.13.2.
zbus = { path = "crates/zbus" }

[dev-dependencies]
tempfile = "3"
# Isolated paste-path experiments (examples/legacy_paste.rs) reuse the exact
# arboard + enigo stack the app pastes with.
arboard = "3.6"

# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

# WebSocket test client for the M2 streaming integration suite.
tokio-tungstenite = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
